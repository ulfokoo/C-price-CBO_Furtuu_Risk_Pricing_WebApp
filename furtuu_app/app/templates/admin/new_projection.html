{% extends "base.html" %}
{% block title %}Add New Projection{% endblock %}
{% block content %}
<h3><i class="bi bi-plus-circle"></i> Add New Projection</h3>
<p class="text-muted">Create a new crop / segment volume &amp; profitability projection. You'll set the detailed cost, fee and provision assumptions on the next page.</p>

<div class="card" style="max-width:650px;">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Product / Value Chain</label>
        <select class="form-select" name="product_id" required>
          <option value="" disabled selected>Choose a product...</option>
          {% for p in products %}
            <option value="{{ p.id }}">{{ p.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Crop / Segment Name</label>
        <input class="form-control" name="crop_name" required placeholder="e.g. Wheat, Poultry, Dairy">
      </div>
      <div class="mb-3">
        <label class="form-label">Year Label</label>
        <input class="form-control" name="year_label" value="Y1" placeholder="e.g. Y1">
      </div>
      <button class="btn btn-success">Create Projection</button>
    </form>
  </div>
</div>
{% endblock %}
