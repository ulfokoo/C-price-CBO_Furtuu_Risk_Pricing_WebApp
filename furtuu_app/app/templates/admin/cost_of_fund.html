{% extends "base.html" %}
{% block title %}Cost of Fund — {{ product.name }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3><i class="bi bi-piggy-bank"></i> Cost of Fund — {{ product.name }}</h3>
  <a href="{{ url_for('admin.edit_product', product_id=product.id) }}" class="btn btn-sm btn-outline-secondary">Back</a>
</div>

<div class="card mb-3">
  <div class="card-header cbo">Add Funding Source</div>
  <div class="card-body">
    <form method="POST" class="row g-2">
      <div class="col-md-5"><input class="form-control" name="name" placeholder="e.g. Savings Deposit" required></div>
      <div class="col-md-3"><input class="form-control" type="number" step="0.01" name="balance" placeholder="Balance" required></div>
      <div class="col-md-2"><input class="form-control" type="number" step="0.001" name="annual_rate" placeholder="Rate %" required></div>
      <div class="col-md-2"><button class="btn btn-success w-100">Add</button></div>
    </form>
  </div>
</div>

<div class="card">
  <div class="card-header cbo">Funding Sources</div>
  <table class="table table-sm mb-0">
    <thead><tr><th>Name</th><th>Balance</th><th>Rate %</th><th></th></tr></thead>
    <tbody>
    {% for src in product.cost_of_fund_sources %}
      <tr>
        <td colspan="4" class="p-0">
          <form method="POST" action="{{ url_for('admin.edit_cost_of_fund_source', src_id=src.id) }}" class="d-flex gap-2 align-items-center p-2">
            <input class="form-control form-control-sm" name="name" value="{{ src.name }}" style="max-width:260px">
            <input class="form-control form-control-sm" type="number" step="0.01" name="balance" value="{{ src.balance }}" style="max-width:160px">
            <input class="form-control form-control-sm" type="number" step="0.001" name="annual_rate" value="{{ "%.3f"|format(src.annual_rate*100) }}" style="max-width:110px">
            <button class="btn btn-sm btn-outline-primary">Save</button>
            <button type="submit" formaction="{{ url_for('admin.delete_cost_of_fund_source', src_id=src.id) }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this funding source?');">Delete</button>
          </form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
