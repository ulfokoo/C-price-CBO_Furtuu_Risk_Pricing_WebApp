{% extends "base.html" %}
{% block title %}Admin — Products{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3><i class="bi bi-diagram-3"></i> Products / Value Chains</h3>
  <a href="{{ url_for('admin.new_product') }}" class="btn btn-success"><i class="bi bi-plus-circle"></i> Add New Product</a>
</div>
<table class="table bg-white table-striped">
  <thead><tr><th>Name</th><th>Description</th><th>Categories</th><th></th></tr></thead>
  <tbody>
  {% for p in products %}
    <tr>
      <td>{{ p.name }}</td>
      <td class="text-muted">{{ p.description }}</td>
      <td>{{ p.categories|length }}</td>
      <td>
        <a href="{{ url_for('admin.edit_product', product_id=p.id) }}" class="btn btn-sm btn-outline-primary">Edit</a>
        <a href="{{ url_for('admin.scorecard_builder', product_id=p.id) }}" class="btn btn-sm btn-outline-secondary">Scorecard</a>
        <form method="POST" action="{{ url_for('admin.delete_product', product_id=p.id) }}" class="d-inline" onsubmit="return confirm('Delete {{ p.name }} and ALL of its data? This cannot be undone.');">
          <button class="btn btn-sm btn-outline-danger">Delete</button>
        </form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
