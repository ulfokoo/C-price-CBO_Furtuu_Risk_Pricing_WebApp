{% extends "base.html" %}
{% block title %}Pricing Inputs — {{ product.name }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3><i class="bi bi-cash-coin"></i> Pricing Inputs — {{ product.name }}</h3>
  <a href="{{ url_for('admin.edit_product', product_id=product.id) }}" class="btn btn-sm btn-outline-secondary">Back</a>
</div>

<div class="card" style="max-width:750px;">
  <div class="card-body">
    <form method="POST" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Cost of Capital (%)</label>
        <input class="form-control" type="number" step="0.0001" name="cost_of_capital" value="{{ "%.4f"|format((pin.cost_of_capital if pin else 0.1838)*100) }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Target Return on RWA (%)</label>
        <input class="form-control" type="number" step="0.0001" name="target_return_on_rwa" value="{{ "%.4f"|format((pin.target_return_on_rwa if pin else 0.19)*100) }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Liquidity Premium (%)</label>
        <input class="form-control" type="number" step="0.0001" name="liquidity_premium" value="{{ "%.4f"|format((pin.liquidity_premium if pin else 0)*100) }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Default Loan Amount (ETB)</label>
        <input class="form-control" type="number" step="0.01" name="loan_amount" value="{{ pin.loan_amount if pin else 100000 }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Applicable Risk Weight (RWA)</label>
        <select class="form-select" name="rwa_option_id">
          {% for r in product.rwa_options %}
            <option value="{{ r.id }}" {{ 'selected' if pin and pin.rwa_option_id==r.id }}>{{ r.label }} ({{ "%.0f%%"|format(r.rwa_value*100) }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Repayment Schedule / Tenure</label>
        <select class="form-select" name="repayment_schedule_id">
          {% for r in product.repayment_schedules %}
            <option value="{{ r.id }}" {{ 'selected' if pin and pin.repayment_schedule_id==r.id }}>{{ r.label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Loss Given Default (%)</label>
        <input class="form-control" type="number" step="0.01" name="loss_given_default" value="{{ "%.2f"|format((pin.loss_given_default if pin else 0.5)*100) }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Exposure at Default (%)</label>
        <input class="form-control" type="number" step="0.01" name="exposure_at_default" value="{{ "%.2f"|format((pin.exposure_at_default if pin else 1.0)*100) }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Expected Access Fee (%)</label>
        <input class="form-control" type="number" step="0.001" name="expected_access_fee_pct" value="{{ "%.3f"|format((pin.expected_access_fee_pct if pin else 0.035)*100) }}">
      </div>
      <div class="mb-3">
        <label class="form-label">NGO Support Max Price Impact (%) — what a 100% NGO allocation is worth</label>
        <input class="form-control" type="number" step="0.01" name="ngo_max_price_impact_pct"
              value="{{ "%.2f"|format((pin.ngo_max_price_impact_pct or 0.0655) * 100) }}">
      </div>
      <div class="col-12">
        <button class="btn btn-success">Save Pricing Inputs</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
